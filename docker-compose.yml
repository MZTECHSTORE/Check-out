version: "3.8"
services:
  mz-checkout:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VENDORAPAY_API_BASE=https://vendorapay.com/api
      - VENDORAPAY_API_KEY=your_vendorapay_api_key_here
      - PAYPAL_CLIENT_ID=your_paypal_client_id
      - PAYPAL_SECRET=your_paypal_secret
      - PAYPAL_ENV=sandbox
      # M-Pesa env vars (if used)
      - MPESA_PROVIDER=safaricom
      - MPESA_CONSUMER_KEY=xxx
      - MPESA_CONSUMER_SECRET=yyy
      - MPESA_SHORTCODE=174379
      - MPESA_PASSKEY=xxxx
      - MPESA_CALLBACK_URL=https://yourdomain.com/api/mpesa/callback
    volumes:
      - ./:/app
