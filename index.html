<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Profissional - Pagamento Seguro</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AZPSW1Sr6x52LwKUtGD1v_r5i1-q-6pnXrkFxNZT7es0jV7HikEL7enB-jKM0VbhW6h7hIVb2IvLxa7I&currency=BRL&intent=capture"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .checkout-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        #paypal-button-container {
            margin: 20px 0;
        }
        .security-info {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 20px;
        }
        .security-info::before {
            content: "🔒 ";
            font-size: 1.2em;
        }
        /* Animação sutil para chamar atenção */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .checkout-container:hover {
            animation: pulse 1s ease-in-out;
        }
        .warning {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            color: #ffd700;
            font-size: 0.9em;
        }
        .success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 10px;
            margin-top: 20px;
            color: #00ff00;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h1>Finalizar Compra</h1>
        <div class="warning">
            ⚠️ Versão de Produção: Substitua "SEU_CLIENT_ID_PRODUCAO_AQUI" pelo seu Client ID LIVE do PayPal.
        </div>
        <p>Pague com Visa, MasterCard ou PayPal de forma segura e rápida.</p>
        <div id="paypal-button-container"></div>
        <div class="security-info">
            Seu pagamento é protegido com criptografia avançada. Valor total: R$ 100,00 (exemplo - ajuste no JS).
        </div>
        <div id="result" style="display: none;"></div>
    </div>

    <script>
        // URL do seu backend Vercel
        const BACKEND_URL = 'https://checkout-backend-mztechstores-projects.vercel.app';

        // Configuração do botão PayPal com estilos profissionais
        paypal.Buttons({
            style: {
                shape: 'rect',
                color: 'gold',  // Cor dourada para destaque profissional
                layout: 'vertical',
                label: 'paypal',
                tagline: false,
                height: 50
            },
            createOrder: function(data, actions) {
                // Defina o valor aqui (exemplo: R$ 100,00 em BRL)
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: '100.00'  // Altere este valor conforme necessário
                        }
                    }]
                });
            },
            onApprove: function(data, actions) {
                // Primeiro, capture no frontend (temporário; em prod, mova tudo pro backend)
                return actions.order.capture().then(function(details) {
                    // Agora, envie para o backend para validação final e logs
                    fetch(`${BACKEND_URL}/capturar-pagamento`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderID: data.orderID })
                    })
                    .then(response => response.json())
                    .then(backendData => {
                        if (backendData.success) {
                            document.getElementById('result').innerHTML = `<div class="success">✅ Pagamento confirmado pelo backend! ID: ${backendData.details.id}</div>`;
                            document.getElementById('result').style.display = 'block';
                            alert('Pagamento realizado com sucesso! Obrigado!');
                        } else {
                            alert('Erro na confirmação: ' + backendData.error);
                        }
                    })
                    .catch(err => {
                        console.error('Erro no backend:', err);
                        alert('Pagamento aprovado, mas erro na confirmação. Contate suporte.');
                    });
                });
            },
            onError: function(err) {
                console.error('Erro no pagamento:', err);
                alert('Ocorreu um erro no processamento. Tente novamente.');
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
