<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Produto Personalizado</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .product { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
        .price { font-size: 24px; color: #28a745; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        #mpesa-phone { margin: 10px 0; padding: 8px; width: 200px; }
        #status { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Checkout - Compra Segura</h1>
    
    <div class="product">
        <h2>Produto Personalizado</h2>
        <p>Descrição: Seu produto customizado incrível! (Edite esta seção com detalhes reais.)</p>
        <div class="price">Preço: 1000 MZN</div>
    </div>
    
    <!-- Botão para Checkout Completo (Cartão ou M-Pesa via redirecionamento) -->
    <button onclick="createPayment()">Comprar Agora (Cartão Visa/MC ou M-Pesa)</button>
    
    <!-- Botão Opcional para M-Pesa Direto (requer número de telefone) -->
    <label for="mpesa-phone">Número M-Pesa (ex: 841234567):</label>
    <input type="text" id="mpesa-phone" placeholder="Seu número M-Pesa">
    <button onclick="createMpesaPayment()">Pagar via M-Pesa Direto</button>
    
    <div id="status"></div>

    <script>
        const API_KEY = '5dkxbk7i1eyagmzxkydwr5uzj6w4inpgqhhc4d08ichuz6o8914hovr0x5jn'; // Sua chave API
        const WEBHOOK_SECRET = 'ix6iv8ypxhcsm2g3zppce97w0j4m6jaxi4bg8wbgotdwnt0620jyb3thixwpdewohpo1qt3ng8nd317hmjtnrjcnwumeq66kilb56hpcrp13brg8ci32zq6r'; // Para validar webhooks no backend
        const AMOUNT = 1000; // Preço em centavos (1000 = 10.00 MZN? Ajuste conforme docs)
        const CONTEXT = 'Pagamento do Produto Personalizado';
        const CALLBACK_URL = 'https://seusite.com/webhook'; // Substitua pela sua URL de webhook
        const RETURN_URL = 'https://seusite.com/obrigado'; // URL após pagamento
        const API_BASE = 'https://vendorapay.com/api';

        async function createPayment() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = 'Processando...';

            try {
                const response = await fetch(`${API_BASE}/payment/create`, {
                    method: 'POST',
                    headers: {
                        'apiKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: AMOUNT,
                        context: CONTEXT,
                        callbackUrl: CALLBACK_URL,
                        returnUrl: RETURN_URL,
                        currency: 'MZN',
                        enviroment: 'prod' // Mude para 'dev' em testes
                    })
                });

                const data = await response.json();
                if (data.success) {
                    statusDiv.innerHTML = 'Redirecionando para checkout...';
                    window.location.href = data.redirectUrl; // Redireciona para escolha de método (cartão ou M-Pesa)
                } else {
                    statusDiv.innerHTML = `Erro: ${data.error}`;
                }
            } catch (error) {
                statusDiv.innerHTML = `Erro de conexão: ${error.message}`;
            }
        }

        async function createMpesaPayment() {
            const phone = document.getElementById('mpesa-phone').value;
            if (!phone) {
                alert('Insira o número M-Pesa!');
                return;
            }

            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = 'Iniciando pagamento M-Pesa...';

            // Placeholder para email e WhatsApp - edite conforme necessário
            const userEmail = 'cliente@exemplo.com'; // Colete do form
            const userWhatsApp = '841234567'; // Colete do form

            try {
                const response = await fetch(`${API_BASE}/payment/mobile`, {
                    method: 'POST',
                    headers: {
                        'apiKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        method: 'mpesa',
                        amount: AMOUNT,
                        context: CONTEXT,
                        useremail: userEmail,
                        userwhatsApp: userWhatsApp,
                        phone: phone
                    })
                });

                const data = await response.json();
                if (data.success) {
                    statusDiv.innerHTML = 'Pagamento M-Pesa iniciado! Verifique seu telefone para confirmação.';
                    // Aqui você pode redirecionar ou mostrar instruções
                } else {
                    statusDiv.innerHTML = `Erro: ${data.error}`;
                }
            } catch (error) {
                statusDiv.innerHTML = `Erro de conexão: ${error.message}`;
            }
        }

        // Função para verificar status (chame após redirecionamento ou via polling)
        async function checkStatus(txnId) {
            const response = await fetch(`${API_BASE}/payment/status`, {
                method: 'POST',
                headers: {
                    'apiKey': API_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: txnId })
            });
            const data = await response.json();
            console.log('Status:', data); // Use para atualizar UI ou banco de dados
            return data;
        }
    </script>
</body>
</html>
