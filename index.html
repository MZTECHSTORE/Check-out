<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MZ TECH STORE - Plataforma de Ganhos</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background: #0f111a; font-family: 'Inter', sans-serif; color: #fff; }
h1, h2 { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
button { transition: all 0.2s ease; }
button:hover { transform: scale(1.05); }

#coin-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
@keyframes coin-fall {
  0% { transform: translateY(-50px) rotate(0deg); opacity:1; }
  100% { transform: translateY(200px) rotate(360deg); opacity:0; }
}
.coin { position:absolute; width:20px; height:20px; background:#00f0ff; border-radius:50%; animation:coin-fall 1s ease-out forwards; box-shadow:0 0 10px #00f0ff; }

.card { background:#1a1c2b; padding:20px; border-radius:12px; box-shadow:0 0 15px #00f0ff; margin-bottom:20px; }
</style>
</head>
<body class="flex flex-col items-center p-4">

<h1 class="text-4xl font-bold mb-6 text-center">💻 MZ TECH STORE - Plataforma de Ganhos</h1>

<!-- Saldo -->
<div class="card w-full max-w-lg relative">
  <p class="text-xl">Saldo USD: <span id="saldo-usd">0.00</span>$</p>
  <p class="text-xl">Saldo MZN: <span id="saldo-mzn">0.00</span>MZN</p>
  <div id="coin-container"></div>
</div>

<!-- Histórico -->
<div class="card w-full max-w-lg">
  <h2 class="text-2xl font-semibold mb-2">Histórico de Ganhos</h2>
  <ul id="historico" class="list-disc pl-5 max-h-48 overflow-y-auto"></ul>
</div>

<!-- Depósito / Saque -->
<div class="card w-full max-w-lg">
  <h2 class="text-2xl font-semibold mb-2">Depósito / Saque</h2>
  <input id="valor-deposito" type="number" step="0.01" placeholder="Valor USD" class="w-full p-2 rounded mb-2 text-black">
  <div class="grid grid-cols-2 gap-4">
    <button onclick="criarPagamentoVendorapay()" class="w-full bg-blue-600 p-3 rounded font-bold">💳 Depositar</button>
    <button onclick="saqueVendorapay()" class="w-full bg-red-600 p-3 rounded font-bold">🏧 Sacar</button>
  </div>
</div>

<!-- Tarefas / Mini Games -->
<div class="card w-full max-w-lg">
  <h2 class="text-2xl font-semibold mb-4">Atividades</h2>
  <div class="mb-4">
    <button onclick="ativarTimeToEarn()" class="w-full bg-green-600 p-3 rounded font-bold">💨 Ganhar por tempo (Time To Earn)</button>
  </div>
  <div class="mb-4">
    <button onclick="startAviador()" class="w-full bg-yellow-600 p-3 rounded font-bold">✈️ Aviador Simulado</button>
    <button id="cashOutBtn" onclick="cashOutAviador()" class="w-full bg-purple-600 p-3 rounded font-bold mt-2 hidden">Cash Out</button>
    <div class="w-full h-4 bg-gray-700 rounded mt-2 overflow-hidden">
      <div id="aviadorBar" class="h-4 bg-gradient-to-r from-blue-400 to-purple-600 w-0"></div>
    </div>
  </div>
  <div class="mb-4">
    <button onclick="raspadinha()" class="w-full bg-pink-600 p-3 rounded font-bold">🎟️ Raspadinha</button>
  </div>
  <div class="mb-4">
    <button onclick="roleta()" class="w-full bg-purple-600 p-3 rounded font-bold">🎡 Roleta</button>
  </div>
  <div class="mb-4">
    <button onclick="ganharClick2()" class="w-full bg-orange-600 p-3 rounded font-bold">🖱️ Click2/Tarefas</button>
  </div>
</div>

<script>
const TAXA_CAMBIO = 63.5;
const USER = 'user1';
let timeToEarnAtivo = false;
let aviadorActive = false;
let aviadorValue = 1;
let aviadorSpeed = 0.01;
let aviadorInterval = null;

// Atualiza saldo e histórico
function updateBalanceFromServer(saldoUSD, historico){
  document.getElementById('saldo-usd').innerText = saldoUSD.toFixed(2);
  document.getElementById('saldo-mzn').innerText = (saldoUSD*TAXA_CAMBIO).toFixed(2);
  const histEl = document.getElementById('historico');
  histEl.innerHTML = '';
  historico.forEach(item => { const li=document.createElement('li'); li.innerText=item; histEl.appendChild(li); });
}

// Confetes
function spawnCoin(){
  const coinContainer = document.getElementById('coin-container');
  const coin=document.createElement('div');
  coin.classList.add('coin');
  coin.style.left=Math.random()*90+'%';
  coinContainer.appendChild(coin);
  setTimeout(()=>coin.remove(),1500);
}

// Backend: fetch saldo
async function fetchSaldo(){
  try {
    const res = await fetch(`/api/saldo/${USER}`);
    const j = await res.json();
    if(j && typeof j.saldoUSD==='number'){updateBalanceFromServer(j.saldoUSD,j.historico);}
  } catch(e){ console.warn('Erro fetch saldo', e); }
}

// Vendorapay criar pagamento
async function criarPagamentoVendorapay(){
  const valor=parseFloat(document.getElementById('valor-deposito').value);
  if(!valor || valor<=0){alert('Digite valor válido'); return;}
  try {
    const res=await fetch('/api/vendorapay/create',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user:USER,amount:valor,currency:'USD'})
    });
    const j=await res.json();
    if(j.success && j.paymentUrl){window.open(j.paymentUrl,'_blank'); pollSaldo();}
    else{alert('Erro criar pagamento: '+(j.error || JSON.stringify(j.raw||j)));}
  } catch(e){ console.error(e); alert('Erro criar pagamento'); }
}

// Vendorapay saque
async function saqueVendorapay(){
  const valor=parseFloat(prompt("Digite valor em USD para saque:"));
  if(!valor || valor<=0){alert('Valor inválido'); return;}
  try {
    const res=await fetch('/api/vendorapay/withdraw',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user:USER,amount:valor,currency:'USD'})
    });
    const j=await res.json();
    if(j.success){alert(`Saque solicitado: $${valor}`); fetchSaldo();}
    else{alert('Erro saque: '+(j.error || JSON.stringify(j.raw||j)));}
  } catch(e){ console.error(e); alert('Erro ao solicitar saque'); }
}

// Ganhos
function adicionarGanho(valor, origem){
  fetch('/api/ganho',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:USER,valor,origem})}).then(fetchSaldo);
  if(valor>0) spawnCoin();
}

// Time To Earn
function ativarTimeToEarn(){
  if(timeToEarnAtivo) return alert('Time To Earn já ativo!');
  timeToEarnAtivo=true;
  setInterval(()=>adicionarGanho(0.01,'TimeToEarn'),1000);
  alert('Time To Earn ativado! +$0.01/s');
}

// Aviador
function startAviador(){
  if(aviadorActive) return;
  aviadorActive=true;
  aviadorValue=1;
  const bar=document.getElementById('aviadorBar');
  const cashBtn=document.getElementById('cashOutBtn');
  bar.style.width='0%';
  cashBtn.style.display='block';
  aviadorInterval=setInterval(()=>{
    aviadorValue+=0.01;
    bar.style.width=Math.min((aviadorValue-1)*20,100)+'%';
    if(Math.random()<0.005){
      clearInterval(aviadorInterval);
      aviadorActive=false;
      bar.style.width='0%';
      cashBtn.style.display='none';
      alert('Aviador terminou sem Cash Out! Perdeu.');
    }
  },50);
}

function cashOutAviador(){
  if(!aviadorActive) return;
  clearInterval(aviadorInterval);
  aviadorActive=false;
  const ganho=(aviadorValue-1).toFixed(2);
  adicionarGanho(parseFloat(ganho),'Aviador x'+aviadorValue.toFixed(2));
  document.getElementById('aviadorBar').style.width='0%';
  document.getElementById('cashOutBtn').style.display='none';
}

// Raspadinha
function raspadinha(){const chance=Math.random(); let ganho=0; if(chance<0.2) ganho=5; else if(chance<0.5) ganho=1; adicionarGanho(ganho,'Raspadinha');}

// Roleta
function roleta(){const escolha=Math.floor(Math.random()*6)+1; const resultado=Math.floor(Math.random()*6)+1; const ganho=(escolha===resultado)?3:0; adicionarGanho(ganho,'Roleta');}

// Click2/Tarefas
function ganharClick2(){const ganho=Math.random()*0.5; adicionarGanho(ganho,'Click2/Tarefa');}

// Atualiza saldo a cada 10s
setInterval(fetchSaldo,10000);
fetchSaldo();
</script>

</body>
</html>
