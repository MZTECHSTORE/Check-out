<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MZ TECH STORE — Checkout Seguro</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Vendorapay Hosted Fields SDK (assumido) -->
  <script src="https://vendorapay.com/sdk/hosted-fields.js"></script>

  <!-- PayPal SDK (substitua YOUR_PAYPAL_CLIENT_ID) -->
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&components=buttons&intent=capture&currency=MZN"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-gray-800 text-gray-100 font-sans">
  <div class="max-w-3xl mx-auto p-6">
    <header class="mb-6 text-center">
      <h1 class="text-3xl font-bold mb-2">MZ TECH STORE — Checkout</h1>
      <p class="text-gray-300">Produto: <strong>Produto Personalizado</strong> — Preço: <span id="product-price">400 MZN</span></p>
      <img src="/assets/product.jpg" alt="Produto" class="mx-auto mt-4 rounded-lg shadow-lg w-full max-w-sm">
    </header>

    <!-- Vendorapay Hosted Fields -->
    <section class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6">
      <h2 class="text-xl font-semibold mb-3 text-purple-400">💳 Pagar com Cartão (Vendorapay)</h2>
      <p class="text-sm text-gray-400 mb-3">Dados do cartão nunca tocam seu servidor — Hosted Fields + tokenização.</p>

      <div id="vendorapay-form" class="space-y-3">
        <div id="card-number-container" class="p-3 bg-gray-700 rounded-lg"></div>
        <div class="flex gap-3">
          <div id="card-expiry-container" class="flex-1 p-3 bg-gray-700 rounded-lg"></div>
          <div id="card-cvv-container" class="w-28 p-3 bg-gray-700 rounded-lg"></div>
        </div>

        <input id="customer-name" type="text" class="w-full p-3 rounded-lg" placeholder="Nome do titular" />

        <button id="vendorapay-submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white p-3 rounded-lg font-bold transition-all">
          Pagar Agora — 400 MZN
        </button>
      </div>

      <p id="vendorapay-status" class="mt-2 text-sm text-green-400"></p>
    </section>

    <!-- PayPal -->
    <section class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6">
      <h2 class="text-xl font-semibold mb-3 text-blue-400">💰 Pagar com PayPal</h2>
      <div id="paypal-button-container"></div>
    </section>

    <!-- M-Pesa -->
    <section class="bg-gray-800 p-6 rounded-xl shadow-lg mb-6">
      <h2 class="text-xl font-semibold mb-3 text-green-400">📱 Pagar com M-Pesa</h2>
      <div class="flex gap-3">
        <input id="mpesa-phone" placeholder="Número M-Pesa (ex: 25884xxxxxxx)" class="flex-1 p-3 rounded-lg border-none focus:ring-2 focus:ring-green-500"/>
        <button id="mpesa-btn" class="bg-green-600 hover:bg-green-700 p-3 rounded-lg text-white font-bold transition-all">Pagar</button>
      </div>
      <p id="mpesa-status" class="mt-2 text-sm text-green-300"></p>
    </section>

    <footer class="text-xs text-gray-400 mt-6 text-center">
      ✅ Seguro: Hosted Fields + tokenização — nenhum dado sensível no servidor.
    </footer>
  </div>

<script>
const PRICE = 400;

// --- Vendorapay Hosted Fields setup ---
// Observação: o SDK abaixo é um exemplo; ajuste conforme SDK real da Vendorapay.
const vendorapay = new Vendorapay.HostedFields({
  // NÃO coloque API key pública aqui se Provider exigir servidor para inicializar o JS;
  // ajuste conforme a documentação do SDK do Vendorapay.
  container: 'vendorapay-form',
  fields: {
    number: { selector: '#card-number-container', placeholder: 'Número do cartão' },
    expiry: { selector: '#card-expiry-container', placeholder: 'MM/AA' },
    cvv: { selector: '#card-cvv-container', placeholder: 'CVV' }
  },
  style: {
    base: { color: '#fff', fontSize: '16px', '::placeholder': { color: '#aaa' } },
    focus: { color: '#fff', borderColor: '#8b5cf6' }
  }
});

// When user clicks pay: create token via Hosted Fields and send token to server
document.getElementById('vendorapay-submit').addEventListener('click', async () => {
  document.getElementById('vendorapay-status').textContent = 'Processando...';
  try {
    // createToken() is provided by Vendorapay Hosted Fields SDK; returns a token (nonce)
    const tokenResult = await vendorapay.createToken({
      cardholderName: document.getElementById('customer-name').value || 'Cliente'
    });

    if (!tokenResult || !tokenResult.token) throw new Error('Falha ao gerar token');

    // send token to your server to create a charge (server uses VENDORAPAY_API_KEY)
    const res = await fetch('/api/vendorapay/charge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: tokenResult.token,
        amount: PRICE,
        currency: 'MZN',
        description: 'Compra MZ TECH STORE'
      })
    });

    const j = await res.json();
    if (res.ok && j.success) {
      document.getElementById('vendorapay-status').textContent = '✅ Pagamento concluído: ' + (j.transactionId || '');
    } else {
      document.getElementById('vendorapay-status').textContent = '❌ Falha: ' + (j.message || JSON.stringify(j));
    }
  } catch (err) {
    document.getElementById('vendorapay-status').textContent = '❌ Erro: ' + err.message;
  }
});

// --- PayPal Buttons (calls server to create order) ---
paypal.Buttons({
  createOrder: () => fetch('/api/paypal/create-order', { method:'POST' }).then(r => r.json()).then(data => data.id),
  onApprove: (data) => fetch('/api/paypal/capture/' + data.orderID, { method:'POST' }).then(r => r.json()).then(()=> alert('Pagamento PayPal concluído!'))
}).render('#paypal-button-container');

// --- M-Pesa ---
document.getElementById('mpesa-btn').addEventListener('click', async () => {
  const phone = document.getElementById('mpesa-phone').value.trim();
  if (!phone) return alert('Insira número M-Pesa');
  document.getElementById('mpesa-status').textContent = 'Solicitando STK Push...';
  const res = await fetch('/api/mpesa/stkpush', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ phone, amount: PRICE })
  });
  const j = await res.json();
  document.getElementById('mpesa-status').textContent = j.message || JSON.stringify(j);
});
</script>
</body>
</html>
