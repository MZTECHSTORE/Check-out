<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MZ TECH STORE - Plataforma de Ganhos</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin:0; font-family:'Inter',sans-serif; background:#0f111a; color:#fff; }
#sidebar { width:200px; background:#1a1c2b; height:100vh; position:fixed; top:0; left:0; display:flex; flex-direction:column; }
#sidebar h2 { color:#00f0ff; text-align:center; margin:20px 0; text-shadow:0 0 10px #00f0ff; }
#sidebar button { padding:15px; margin:5px; border:none; background:#222438; color:#fff; border-radius:8px; cursor:pointer; transition:0.2s; }
#sidebar button:hover{background:#00f0ff;color:#000;}
#main { margin-left:200px; padding:20px; flex:1; }
.card { background:#1a1c2b; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 0 10px #00f0ff; }
#coin-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
@keyframes coin-fall { 0%{transform:translateY(-50px) rotate(0deg);opacity:1;}100%{transform:translateY(200px) rotate(360deg);opacity:0;} }
.coin { position:absolute; width:20px; height:20px; background:#00f0ff; border-radius:50%; animation:coin-fall 1s ease-out forwards; box-shadow:0 0 10px #00f0ff; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>MZ TECH STORE</h2>
  <button onclick="showSection('dashboard')">🏠 Dashboard</button>
  <button onclick="showSection('aviator')">✈️ Aviador</button>
  <button onclick="showSection('roleta')">🎡 Roleta</button>
  <button onclick="showSection('raspadinha')">🎟️ Raspadinha</button>
  <button onclick="showSection('click2')">🖱️ Click2/Tarefas</button>
</div>

<div id="main">
  <!-- Saldo -->
  <div class="card">
    <p>Saldo USD: <span id="saldo-usd">0.00</span>$</p>
    <p>Saldo MZN: <span id="saldo-mzn">0.00</span>MZN</p>
  </div>

  <!-- Histórico -->
  <div class="card">
    <h2 class="text-xl font-bold mb-2">Histórico de Ganhos</h2>
    <ul id="historico" class="list-disc pl-5 max-h-48 overflow-y-auto"></ul>
  </div>

  <!-- Depósito / Saque -->
  <div class="card">
    <h2 class="text-xl font-bold mb-2">Depósito / Saque</h2>
    <input id="valor-deposito" type="number" step="0.01" placeholder="Valor USD" class="w-full p-2 rounded mb-2 text-black">
    <div class="grid grid-cols-2 gap-4">
      <button onclick="criarPagamentoVendorapay()" class="w-full bg-blue-600 p-3 rounded font-bold">💳 Depositar</button>
      <button onclick="saqueVendorapay()" class="w-full bg-red-600 p-3 rounded font-bold">🏧 Sacar</button>
    </div>
  </div>

  <!-- Sections -->
  <div id="dashboard" class="card section">
    <h2 class="text-xl font-bold mb-2">Dashboard</h2>
    <p>Escolha uma atividade no menu lateral para começar a ganhar!</p>
  </div>

  <div id="aviator" class="card section" style="display:none;">
    <h2 class="text-xl font-bold mb-2">Aviador</h2>
    <div id="aviador-container" style="position:relative; height:200px; background:#222438; border-radius:12px;">
      <div id="aviador-bar" style="height:8px;background:linear-gradient(90deg,#00f0ff,#a855f7);width:0%;"></div>
      <div id="coin-container"></div>
    </div>
    <button id="startAviadorBtn" onclick="startAviador()" class="w-full bg-yellow-600 p-3 rounded font-bold mt-2">Iniciar Aviador</button>
    <button id="cashOutBtn" onclick="cashOutAviador()" class="w-full bg-purple-600 p-3 rounded font-bold mt-2 hidden">Cash Out</button>
  </div>

  <div id="roleta" class="card section" style="display:none;">
    <h2 class="text-xl font-bold mb-2">Roleta</h2>
    <div style="width:200px;height:200px;border-radius:50%;border:5px solid #00f0ff;margin:0 auto;display:flex;align-items:center;justify-content:center;">
      <div id="wheel-number" class="text-white text-4xl font-bold">0</div>
    </div>
    <button onclick="roleta()" class="w-full bg-purple-600 p-3 rounded font-bold mt-2">Girar Roleta</button>
  </div>

  <div id="raspadinha" class="card section" style="display:none;">
    <h2 class="text-xl font-bold mb-2">Raspadinha</h2>
    <button onclick="raspadinha()" class="w-full bg-pink-600 p-3 rounded font-bold mt-2">Raspar</button>
  </div>

  <div id="click2" class="card section" style="display:none;">
    <h2 class="text-xl font-bold mb-2">Click2 / Tarefas</h2>
    <button onclick="ganharClick2()" class="w-full bg-orange-600 p-3 rounded font-bold mt-2">Completar Tarefa</button>
    <button onclick="ativarTimeToEarn()" class="w-full bg-green-600 p-3 rounded font-bold mt-2">💨 Time To Earn</button>
  </div>
</div>

<script>
const TAXA_CAMBIO=63.5;
const USER='user1';
let aviadorActive=false;
let aviadorValue=1;
let aviadorSpeed=0.01;
let aviadorInterval=null;
let timeToEarnAtivo=false;

function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.style.display='none');
  document.getElementById(id).style.display='block';
}

function updateBalanceFromServer(saldoUSD,historico){
  document.getElementById('saldo-usd').innerText=saldoUSD.toFixed(2);
  document.getElementById('saldo-mzn').innerText=(saldoUSD*TAXA_CAMBIO).toFixed(2);
  const histEl=document.getElementById('historico'); histEl.innerHTML=''; historico.forEach(item=>{const li=document.createElement('li');li.innerText=item;histEl.appendChild(li);});
}

function adicionarGanho(valor,origem){
  fetch('/api/ganho',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:USER,valor,origem})}).then(fetchSaldo);
  if(valor>0) spawnCoin();
}

function fetchSaldo(){fetch(`/api/saldo/${USER}`).then(r=>r.json()).then(j=>{if(j && typeof j.saldoUSD==='number'){updateBalanceFromServer(j.saldoUSD,j.historico);}});}

function spawnCoin(){const coin=document.createElement('div');coin.classList.add('coin');coin.style.left=Math.random()*90+'%';document.getElementById('coin-container').appendChild(coin);setTimeout(()=>coin.remove(),1500);}

async function criarPagamentoVendorapay(){const valor=parseFloat(document.getElementById('valor-deposito').value);if(!valor || valor<=0){alert('Digite valor válido'); return;} try{const res=await fetch('/api/vendorapay/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:USER,amount:valor,currency:'USD'})});const j=await res.json();if(j.success && j.paymentUrl){window.open(j.paymentUrl,'_blank'); fetchSaldo();}else{alert('Erro criar pagamento');}}catch(e){console.error(e); alert('Erro criar pagamento');}}
async function saqueVendorapay(){const valor=parseFloat(prompt("Digite valor USD para saque:")); if(!valor || valor<=0){alert('Valor inválido'); return;} try{const res=await fetch('/api/vendorapay/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:USER,amount:valor,currency:'USD'})});const j=await res.json();if(j.success){alert(`Saque solicitado: $${valor}`);fetchSaldo();}else{alert('Erro saque');}}catch(e){console.error(e);alert('Erro ao solicitar saque');}}

// Aviador
function startAviador(){if(aviadorActive)return;aviadorActive=true;aviadorValue=1;document.getElementById('aviador-bar').style.width='0%';document.getElementById('cashOutBtn').style.display='block';aviadorInterval=setInterval(()=>{aviadorValue+=aviadorSpeed;document.getElementById('aviador-bar').style.width=Math.min((aviadorValue-1)*20,100)+'%';if(Math.random()<0.005){clearInterval(aviadorInterval);aviadorActive=false;document.getElementById('aviador-bar').style.width='0%';document.getElementById('cashOutBtn').style.display='none';alert('Aviador terminou sem Cash Out!');}},50);}
function cashOutAviador(){if(!aviadorActive)return;clearInterval(aviadorInterval);aviadorActive=false;adicionarGanho(aviadorValue-1,'Aviador x'+aviadorValue.toFixed(2));document.getElementById('aviador-bar').style.width='0%';document.getElementById('cashOutBtn').style.display='none';}

// Roleta
function roleta(){const escolha=Math.floor(Math.random()*6)+1;const resultado=Math.floor(Math.random()*6)+1;const ganho=(escolha===resultado)?3:0;adicionarGanho(ganho,'Roleta');document.getElementById('wheel-number').innerText=resultado;}

// Raspadinha
function raspadinha(){const chance=Math.random();let ganho=0;if(chance<0.2)ganho=5;else if(chance<0.5)ganho=1;adicionarGanho(ganho,'Raspadinha');}

// Click2/Tarefas
function ganharClick2(){const ganho=Math.random()*0.5;adicionarGanho(ganho,'Click2/Tarefa');}
function ativarTimeToEarn(){if(timeToEarnAtivo) return alert('Time To Earn já ativo!'); timeToEarnAtivo=true; setInterval(()=>adicionarGanho(0.01,'TimeToEarn'),1000); alert('Time To Earn ativado!');}

fetchSaldo();
setInterval(fetchSaldo,10000);
</script>

</body>
</html>
