<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Profissional - Pagamento Seguro</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AZPSW1Sr6x52LwKUtGD1v_r5i1-q-6pnXrkFxNZT7es0jV7HikEL7enB-jKM0VbhW6h7hIVb2IvLxa7I&currency=BRL&intent=capture"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .checkout-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }
        .option {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .option:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .option.active {
            border: 2px solid #ffd700;
        }
        #paypal-section, #mpesa-section {
            display: none;
        }
        #paypal-section.active, #mpesa-section.active {
            display: block;
        }
        input[type="tel"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            text-align: center;
        }
        button {
            background: #ffd700;
            color: #1e3c72;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #ffed4e;
        }
        .security-info {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 20px;
        }
        .security-info::before {
            content: "🔒 ";
            font-size: 1.2em;
        }
        .warning {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            color: #ffd700;
            font-size: 0.9em;
        }
        .success, .error {
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .success { background: rgba(0, 255, 0, 0.2); border: 1px solid #00ff00; color: #00ff00; }
        .error { background: rgba(255, 0, 0, 0.2); border: 1px solid #ff0000; color: #ff0000; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .checkout-container:hover { animation: pulse 1s ease-in-out; }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h1>Finalizar Compra</h1>
        <div class="warning">
            ⚠️ Substitua "SEU_CLIENT_ID_PRODUCAO_AQUI" pelo Client ID LIVE do PayPal.
        </div>
        <p>Valor total: R$ 100,00. Escolha o método de pagamento.</p>
        
        <div class="payment-options">
            <div class="option" onclick="selectPayment('paypal')">💳 PayPal (Visa/MasterCard)</div>
            <div class="option" onclick="selectPayment('mpesa')">📱 M-Pesa</div>
        </div>
        
        <div id="paypal-section">
            <div id="paypal-button-container"></div>
        </div>
        
        <div id="mpesa-section">
            <label for="phone">Número de Celular (ex: +254712345678):</label>
            <input type="tel" id="phone" placeholder="+254712345678" required>
            <br>
            <button onclick="payWithMpesa()">Pagar com M-Pesa</button>
        </div>
        
        <div id="result" style="display: none;"></div>
        <div class="security-info">
            Pagamentos protegidos com criptografia. Suporte: contato@seudominio.com
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://checkout-backend-mztechstores-projects.vercel.app';
        const VALOR = '100.00';  // Valor fixo; mude aqui

        function selectPayment(method) {
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('paypal-section').classList.toggle('active', method === 'paypal');
            document.getElementById('mpesa-section').classList.toggle('active', method === 'mpesa');
            if (method === 'paypal') renderPayPal();
        }

        function renderPayPal() {
            paypal.Buttons({
                style: {
                    shape: 'rect', color: 'gold', layout: 'vertical', label: 'paypal', tagline: false, height: 50
                },
                createOrder: (data, actions) => actions.order.create({
                    purchase_units: [{ amount: { value: VALOR } }]
                }),
                onApprove: (data, actions) => actions.order.capture().then(details => {
                    fetch(`${BACKEND_URL}/capturar-pagamento`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderID: data.orderID })
                    }).then(res => res.json()).then(backendData => {
                        showResult(backendData.success ? 'success' : 'error', backendData.message || backendData.error);
                    }).catch(err => showResult('error', 'Erro na confirmação'));
                }),
                onError: (err) => showResult('error', 'Erro no PayPal')
            }).render('#paypal-button-container');
        }

        async function payWithMpesa() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) return showResult('error', 'Insira o número de celular');

            try {
                const response = await fetch(`${BACKEND_URL}/processar-mpesa`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ valor: VALOR, numero_celular: phone })
                });
                const data = await response.json();
                showResult(data.success ? 'success' : 'error', data.message || data.error);
            } catch (err) {
                showResult('error', 'Erro de conexão');
            }
        }

        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="${type}">${type === 'success' ? '✅' : '❌'} ${message}</div>`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
