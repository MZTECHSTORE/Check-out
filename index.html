<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Produto Personalizado</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .product { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
        .price { font-size: 24px; color: #28a745; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 100%; max-width: 300px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Checkout - Compra Segura</h1>
    
    <div class="product">
        <h2>Produto Personalizado</h2>
        <p>Descrição: Seu produto customizado incrível! (Edite esta seção com detalhes reais.)</p>
        <div class="price">Preço: 1000 MZN</div>
    </div>
    
    <!-- Formulário para Pagamento com Cartão (Visa/MasterCard) -->
    <h3>Pagar com Cartão (Visa/MasterCard)</h3>
    <div class="form-group">
        <label for="card-number">Número do Cartão</label>
        <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required>
    </div>
    <div class="form-group">
        <label for="card-expiry">Validade (MM/AA)</label>
        <input type="text" id="card-expiry" placeholder="MM/AA" required>
    </div>
    <div class="form-group">
        <label for="card-cvv">CVV</label>
        <input type="text" id="card-cvv" placeholder="123" required>
    </div>
    <div class="form-group">
        <label for="card-holder">Nome no Cartão</label>
        <input type="text" id="card-holder" placeholder="Nome Completo" required>
    </div>
    <button onclick="createCardPayment()">Pagar com Cartão</button>
    
    <!-- Formulário para M-Pesa -->
    <h3>Ou Pagar com M-Pesa</h3>
    <div class="form-group">
        <label for="mpesa-phone">Número M-Pesa (ex: 841234567)</label>
        <input type="text" id="mpesa-phone" placeholder="Seu número M-Pesa">
    </div>
    <button onclick="createMpesaPayment()">Pagar via M-Pesa</button>
    
    <div id="status"></div>

    <script>
        const API_KEY = '5dkxbk7i1eyagmzxkydwr5uzj6w4inpgqhhc4d08ichuz6o8914hovr0x5jn'; // Sua chave API
        const WEBHOOK_SECRET = 'ix6iv8ypxhcsm2g3zppce97w0j4m6jaxi4bg8wbgotdwnt0620jyb3thixwpdewohpo1qt3ng8nd317hmjtnrjcnwumeq66kilb56hpcrp13brg8ci32zq6r'; // Para validar webhooks
        const AMOUNT = 1000; // Preço em centavos (1000 = 10.00 MZN? Ajuste conforme docs)
        const CONTEXT = 'Pagamento do Produto Personalizado';
        const CALLBACK_URL = 'https://seusite.com/webhook'; // Substitua pela sua URL de webhook
        const API_BASE = 'https://vendorapay.com/api';

        async function createCardPayment() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = 'Processando pagamento com cartão...';

            const cardNumber = document.getElementById('card-number').value.replace(/\s/g, '');
            const cardExpiry = document.getElementById('card-expiry').value;
            const cardCvv = document.getElementById('card-cvv').value;
            const cardHolder = document.getElementById('card-holder').value;

            // Validações básicas
            if (!cardNumber || !cardExpiry || !cardCvv || !cardHolder) {
                statusDiv.innerHTML = 'Por favor, preencha todos os campos do cartão.';
                return;
            }
            if (!/^\d{16}$/.test(cardNumber)) {
                statusDiv.innerHTML = 'Número do cartão inválido (16 dígitos).';
                return;
            }
            if (!/^\d{2}\/\d{2}$/.test(cardExpiry)) {
                statusDiv.innerHTML = 'Validade do cartão inválida (use MM/AA).';
                return;
            }
            if (!/^\d{3,4}$/.test(cardCvv)) {
                statusDiv.innerHTML = 'CVV inválido (3 ou 4 dígitos).';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/payment/card`, {
                    method: 'POST',
                    headers: {
                        'apiKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: AMOUNT,
                        context: CONTEXT,
                        callbackUrl: CALLBACK_URL,
                        currency: 'MZN',
                        enviroment: 'dev', // Mude para 'dev' em testes
                        card: {
                            number: cardNumber,
                            expiry: cardExpiry, // Formato MM/AA
                            cvv: cardCvv,
                            holder: cardHolder
                        }
                    })
                });

                const data = await response.json();
                if (data.success) {
                    statusDiv.innerHTML = 'Pagamento com cartão processado com sucesso! Aguardando confirmação.';
                    // Opcional: Chame checkStatus(data.id) para verificar
                } else {
                    statusDiv.innerHTML = `Erro: ${data.error || 'Falha no processamento do cartão.'}`;
                }
            } catch (error) {
                statusDiv.innerHTML = `Erro de conexão: ${error.message}`;
            }
        }

        async function createMpesaPayment() {
            const phone = document.getElementById('mpesa-phone').value;
            const statusDiv = document.getElementById('status');
            
            if (!phone || !/^\d{9}$/.test(phone)) {
                statusDiv.innerHTML = 'Insira um número M-Pesa válido (ex: 841234567).';
                return;
            }

            statusDiv.innerHTML = 'Iniciando pagamento M-Pesa...';

            const userEmail = 'cliente@exemplo.com'; // Colete do formulário
            const userWhatsApp = phone; // Ajuste conforme necessário

            try {
                const response = await fetch(`${API_BASE}/payment/mobile`, {
                    method: 'POST',
                    headers: {
                        'apiKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        method: 'mpesa',
                        amount: AMOUNT,
                        context: CONTEXT,
                        useremail: userEmail,
                        userwhatsApp: userWhatsApp,
                        phone: phone
                    })
                });

                const data = await response.json();
                if (data.success) {
                    statusDiv.innerHTML = 'Pagamento M-Pesa iniciado! Verifique seu telefone para confirmação.';
                } else {
                    statusDiv.innerHTML = `Erro: ${data.error || 'Falha ao iniciar M-Pesa.'}`;
                }
            } catch (error) {
                statusDiv.innerHTML = `Erro de conexão: ${error.message}`;
            }
        }

        async function checkStatus(txnId) {
            try {
                const response = await fetch(`${API_BASE}/payment/status`, {
                    method: 'POST',
                    headers: {
                        'apiKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: txnId })
                });
                const data = await response.json();
                console.log('Status:', data);
                return data;
            } catch (error) {
                console.error('Erro ao verificar status:', error);
            }
        }
    </script>
</body>
</html>
