<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Produto Personalizado</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .product { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
        .price { font-size: 24px; color: #28a745; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 100%; max-width: 300px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .error { color: #dc3545; background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Checkout - Compra Segura</h1>
    
    <div class="product">
        <h2>Produto Personalizado</h2>
        <p>Descrição: Seu produto customizado incrível!</p>
        <div class="price">Preço: 1000 MZN</div>
    </div>
    
    <h3>Pagar com Cartão (Visa/MasterCard)</h3>
    <div class="form-group">
        <label for="card-number">Número do Cartão</label>
        <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required>
    </div>
    <div class="form-group">
        <label for="card-expiry">Validade (MM/AA)</label>
        <input type="text" id="card-expiry" placeholder="MM/AA" required>
    </div>
    <div class="form-group">
        <label for="card-cvv">CVV</label>
        <input type="text" id="card-cvv" placeholder="123" required>
    </div>
    <div class="form-group">
        <label for="card-holder">Nome no Cartão</label>
        <input type="text" id="card-holder" placeholder="Nome Completo" required>
    </div>
    <button onclick="createCardPayment()">Pagar com Cartão</button>
    
    <h3>Ou Pagar com M-Pesa</h3>
    <div class="form-group">
        <label for="mpesa-phone">Número M-Pesa (ex: 841234567)</label>
        <input type="text" id="mpesa-phone" placeholder="Seu número M-Pesa">
    </div>
    <button onclick="createMpesaPayment()">Pagar via M-Pesa</button>
    
    <div id="status"></div>

    <script>
        const API_KEY = '5dkxbk7i1eyagmzxkydwr5uzj6w4inpgqhhc4d08ichuz6o8914hovr0x5jn';
        const WEBHOOK_SECRET = 'ix6iv8ypxhcsm2g3zppce97w0j4m6jaxi4bg8wbgotdwnt0620jyb3thixwpdewohpo1qt3ng8nd317hmjtnrjcnwumeq66kilb56hpcrp13brg8ci32zq6r';
        const AMOUNT = 1000;
        const CONTEXT = 'Pagamento do Produto Personalizado';
        const CALLBACK_URL = 'https://seusite.com/webhook'; // Substitua por URL real
        const API_BASE = 'https://vendorapay.com/api';

        function updateStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            if (isError) statusDiv.classList.add('error');
            else statusDiv.classList.remove('error');
            console.log(message);
        }

        async function createCardPayment() {
            updateStatus('Processando pagamento com cartão...');

            const cardNumber = document.getElementById('card-number').value.replace(/\s/g, '');
            const cardExpiry = document.getElementById('card-expiry').value;
            const cardCvv = document.getElementById('card-cvv').value;
            const cardHolder = document.getElementById('card-holder').value;

            if (!cardNumber || !cardExpiry || !cardCvv || !cardHolder) {
                updateStatus('Preencha todos os campos do cartão.', true);
                return;
            }
            if (!/^\d{16}$/.test(cardNumber)) {
                updateStatus('Número do cartão inválido (16 dígitos).', true);
                return;
            }
            if (!/^\d{2}\/\d{2}$/.test(cardExpiry)) {
                updateStatus('Validade inválida (use MM/AA).', true);
                return;
            }
            if (!/^\d{3,4}$/.test(cardCvv)) {
                updateStatus('CVV inválido (3 ou 4 dígitos).', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/payment/card`, {
                    method: 'POST',
                    headers: {
                        'apiKey': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: AMOUNT,
                        context: CONTEXT,
                        callbackUrl: CALLBACK_URL,
                        currency: 'MZN',
                        enviroment: 'dev', // Use 'dev' para testes
                        card: { number: cardNumber, expiry: cardExpiry, cvv: cardCvv, holder: cardHolder }
                    })
                });

                const data = await response.json();
                console.log('Resposta API (Cartão):', data); // Log completo
                if (data.success) {
                    updateStatus('Pagamento com cartão processado! Aguardando confirmação.');
                } else {
                    updateStatus(`Erro: ${data.error || data.message || 'Acesso negado. Contate o administrador.'}`, true);
                }
            } catch (error) {
                console.error('Erro completo (Cartão):', error);
                updateStatus(`Erro de conexão: ${error.message}. Verifique o console.`, true);
            }
        }

        async function createMpesaPayment() {
            const phone = document.getElementById('mpesa-phone').value;
            updateStatus('Iniciando pagamento M-Pesa...');

            if (!phone || !/^\d{9}$/.test(phone)) {
                updateStatus('Número M-Pesa inválido (ex: 841234567).', true);
                return;
            }

        async function createCardPayment() {
    const cardNumber = document.getElementById('card-number').value.replace(/\s/g, '');
    const cardExpiry = document.getElementById('card-expiry').value;
    const cardCvv = document.getElementById('card-cvv').value;
    const cardHolder = document.getElementById('card-holder').value;
    const statusDiv = document.getElementById('status');

    // Validações
    if (!cardNumber || !/^\d{16}$/.test(cardNumber)) {
        statusDiv.textContent = 'Número do cartão inválido (16 dígitos).';
        return;
    }
    if (!cardExpiry || !/^(0[1-9]|1[0-2])\/\d{2}$/.test(cardExpiry)) {
        statusDiv.textContent = 'Validade inválida (use MM/AA, ex.: 12/25).';
        return;
    }
    if (!cardCvv || !/^\d{3,4}$/.test(cardCvv)) {
        statusDiv.textContent = 'CVV inválido (3 ou 4 dígitos).';
        return;
    }
    if (!cardHolder) {
        statusDiv.textContent = 'Informe o nome no cartão.';
        return;
    }

    statusDiv.textContent = 'Processando pagamento com cartão...';

    try {
        const response = await fetch(`${API_BASE}/payment/card`, {
            method: 'POST',
            headers: {
                'apiKey': '5dkxbk7i1eyagmzxkydwr5uzj6w4inpgqhhc4d08ichuz6o8914hovr0x5jn',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                amount: 1000, // Ajuste o valor
                context: 'Pagamento do Produto Personalizado',
                callbackUrl: 'https://seusite.com/webhook',
                currency: 'MZN',
                enviroment: 'dev', // Confirme com Vendorapay
                card: {
                    number: cardNumber,
                    expiry: cardExpiry,
                    cvv: cardCvv,
                    holder: cardHolder
                }
            })
        });

        const data = await response.json();
        console.log('Resposta API:', data);
        if (data.success) {
            statusDiv.textContent = 'Pagamento processado! Aguardando confirmação.';
        } else {
            statusDiv.textContent = `Erro: ${data.error || data.message || 'Contacte o administrador.'}`;
        }
    } catch (error) {
        console.error('Erro completo:', error);
        statusDiv.textContent = `Erro de conexão: ${error.message}. Verifique sua internet.`;
    }
}
