<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Profissional - MZ TECH STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.paypal.com/sdk/js?client-id=AZPSW1Sr6x52LwKUtGD1v_r5i1-q-6pnXrkFxNZT7es0jV7HikEL7enB-jKM0VbhW6h7hIVb2IvLxa7I&currency=MZN&intent=capture"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .checkout-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-align: left;
        }
        .total {
            text-align: right;
            font-size: 1.5em;
            color: #ffd700;
            margin: 20px 0;
            font-weight: bold;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        #paypal-button-container {
            margin: 20px 0;
        }
        .security-info {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 20px;
        }
        .security-info::before {
            content: "🔒 ";
            font-size: 1.2em;
        }
        /* Animação sutil para chamar atenção */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .checkout-container:hover {
            animation: pulse 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <img src="https://via.placeholder.com/150x50/1e3c72/FFFFFF?text=MZ+TECH+STORE" alt="Logo MZ TECH STORE" class="logo">
        <h1>Finalizar Compra</h1>
        <p>Pague com Visa, MasterCard ou PayPal de forma segura e rápida.</p>
        
        <div class="cart-item">
            <span>Smartphone Galaxy S24</span>
            <span>1 x 1.200 MZN</span>
        </div>
        <div class="cart-item">
            <span>Fones Wireless AirPods</span>
            <span>1 x 800 MZN</span>
        </div>
        <div class="total">
            Total: 2.000 MZN
        </div>
        
        <div id="paypal-button-container"></div>
        <div class="security-info">
            Seu pagamento é protegido com criptografia avançada. Recebemos diretamente no PayPal Business.
        </div>
    </div>

    <script>
        // Configuração do botão PayPal com estilos profissionais - Recebimento direto no PayPal
        paypal.Buttons({
            style: {
                shape: 'rect',
                color: 'gold',  // Cor dourada para destaque profissional
                layout: 'vertical',
                label: 'paypal',
                tagline: false,
                height: 50
            },
            createOrder: function(data, actions) {
                // Defina o valor aqui (exemplo: 2.000 MZN)
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: '2000.00'  // Altere este valor conforme necessário
                        }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    // Pagamento capturado e recebido no PayPal Business
                    alert('Pagamento realizado com sucesso! Obrigado, ' + details.payer.name.given_name + '! Fundos recebidos no PayPal.');
                    // Em produção, redirecione para página de sucesso: window.location.href = '/sucesso.html?order=' + data.orderID;
                });
            },
            onError: function(err) {
                console.error('Erro no pagamento:', err);
                alert('Ocorreu um erro no processamento. Tente novamente.');
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
